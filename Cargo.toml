[package]
name = "mypdf"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Visualizzatore PDF minimale per Windows: anteprima, zoom, stampa e unione di più PDF in uno"
license = "MIT"
repository = "https://github.com/erik504/myPDF"
build = "build.rs"

[lib]
name = "mypdf"
path = "src/lib.rs"

[[bin]]
name = "myPDF"
path = "src/main.rs"

[dependencies]
lopdf = { version = "0.47", default-features = false }
windows = { version = "0.58", features = [
  "Foundation",
  "Data_Pdf",
  "Storage_Streams",
  "Graphics_Imaging",
  "UI",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 3

